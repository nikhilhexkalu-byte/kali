<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kali Linux — Terminal</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('/assets/fonts/JetBrainsMonoNL-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/assets/fonts/JetBrainsMonoNL-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  :root {
    --page: #0a0a1a;
    --chrome-bg: #1a1a2e;
    --chrome-border: #2a2a4a;
    --glow: #00ff41;
    --shell-bg: #0c0c0c;
    --title-text: #e0e0e0;
    --btn-close: #ff5f57;
    --btn-min: #febc2e;
    --btn-max: #28c840;
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--page);
    font-family: 'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;
  }

  .stage {
    position: fixed;
    inset: 0;
    padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    display: flex;
  }

  /* ── Window ─────────────────────────────────────── */
  .window {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    background: var(--shell-bg);
    box-shadow:
      0 0 0 1.5px var(--glow),
      0 0 30px rgba(0, 255, 65, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.6);
    animation: glow-pulse 4s ease-in-out infinite alternate;
  }
  @keyframes glow-pulse {
    from { box-shadow: 0 0 0 1.5px var(--glow), 0 0 20px rgba(0, 255, 65, 0.1), 0 20px 60px rgba(0, 0, 0, 0.6); }
    to   { box-shadow: 0 0 0 1.5px var(--glow), 0 0 40px rgba(0, 255, 65, 0.2), 0 20px 60px rgba(0, 0, 0, 0.6); }
  }

  /* ── Title bar ──────────────────────────────────── */
  .title-bar {
    flex-shrink: 0;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--chrome-border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
  }
  .window-controls { display: flex; gap: 8px; flex-shrink: 0; }
  .win-btn { width: 13px; height: 13px; border-radius: 50%; }
  .win-btn.close { background: var(--btn-close); }
  .win-btn.minimize { background: var(--btn-min); }
  .win-btn.maximize { background: var(--btn-max); }
  .title-center {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .kali-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .title-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--title-text);
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-spacer { width: 55px; flex-shrink: 0; display: flex; justify-content: flex-end; }
  .timer {
    font-size: 12px;
    font-weight: 700;
    color: var(--glow);
    border: 1px solid rgba(0, 255, 65, 0.45);
    border-radius: 6px;
    padding: 2px 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .timer.low { color: #ff5f57; border-color: rgba(255, 95, 87, 0.6); animation: low-blink 1s step-end infinite; }
  @keyframes low-blink { 50% { opacity: 0.55; } }

  /* ── Terminal frame ─────────────────────────────── */
  .term-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
    background: var(--shell-bg);
  }
  .term-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--shell-bg);
  }
  /* Faint scanlines — pointer-events off so typing/clicks reach ttyd */
  .term-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.015) 2px, rgba(0, 255, 65, 0.015) 4px);
    pointer-events: none;
  }

  /* ── Error state ────────────────────────────────── */
  .term-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: #c8d6e5;
    font-size: 14px;
    text-align: center;
    padding: 24px;
    z-index: 1;
  }
  .term-error.show { display: flex; }
  .term-error .err-code { font-size: 48px; font-weight: 800; color: rgba(0, 255, 65, 0.2); }
  .term-error a {
    color: var(--glow);
    text-decoration: none;
    font-size: 13px;
    margin-top: 8px;
    padding: 6px 14px;
    border: 1px solid rgba(0, 255, 65, 0.4);
    border-radius: 6px;
  }
  .term-error a:hover { background: rgba(0, 255, 65, 0.08); }

  /* ── Second-tab notice ──────────────────────────── */
  .peek {
    position: absolute;
    top: 14px;
    left: 50%;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: calc(100% - 28px);
    padding: 10px 12px 10px 16px;
    background: rgba(12, 12, 12, 0.96);
    border: 1px solid var(--glow);
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(0, 255, 65, 0.25), 0 10px 30px rgba(0, 0, 0, 0.6);
    color: #e0e0e0;
    font-size: 13px;
    line-height: 1.4;
    transform: translate(-50%, -12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .peek.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .peek .eyes { font-size: 18px; flex-shrink: 0; }
  .peek b { color: var(--glow); }
  .peek button {
    flex-shrink: 0;
    background: none;
    border: 1px solid rgba(0, 255, 65, 0.4);
    border-radius: 6px;
    color: var(--glow);
    font: inherit;
    font-size: 12px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .peek button:hover { background: rgba(0, 255, 65, 0.1); }

  @media (max-width: 480px) {
    .stage { padding: 6px; }
    .window { border-radius: 10px; }
    .title-bar { padding: 8px 10px; gap: 8px; }
    .win-btn { width: 11px; height: 11px; }
    .title-spacer { width: auto; }
    .timer { font-size: 11px; padding: 1px 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .window, .timer.low { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="window">
    <div class="title-bar">
      <div class="window-controls" aria-hidden="true">
        <div class="win-btn close"></div>
        <div class="win-btn minimize"></div>
        <div class="win-btn maximize"></div>
      </div>
      <div class="title-center">
        <svg class="kali-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="3.5" width="20" height="17" rx="3" stroke="#00ff41" stroke-width="1.8"/>
          <path d="M6.5 9.5 10 12l-3.5 2.5" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 15h5" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="title-text">Kali Linux – Terminal</span>
      </div>
      <div class="title-spacer"><span class="timer" id="timer" hidden title="Time left in this lab session"></span></div>
    </div>
    <div class="term-wrap">
      <div class="peek" id="peek" role="status" aria-live="polite">
        <span class="eyes" aria-hidden="true">&#x1F440;</span>
        <span><b>We know you opened something…</b> but we&rsquo;re not saying anything.</span>
        <button type="button" id="peekClose" aria-label="Dismiss">OK</button>
      </div>
      <iframe id="term" src="about:blank" allowfullscreen title="Lab terminal"></iframe>
      <div class="term-error" id="termErr">
        <div class="err-code">--</div>
        <div>Lab terminal not available</div>
        <a href="/">Back to exam</a>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  var m = window.location.pathname.match(/\/lab\/(\d+)/);
  if (m && parseInt(m[1], 10) >= 1 && parseInt(m[1], 10) <= 10) {
    document.getElementById('term').src = '/term/' + m[1] + '/';
  } else {
    document.getElementById('termErr').classList.add('show');
  }

  // ── Block copy/paste from external environment ──────────────
  function blockClipboard(e) { e.preventDefault(); e.stopPropagation(); }
  function blockKeys(e) {
    // Block Ctrl+V, Ctrl+Shift+V (paste), Ctrl+Shift+C (copy from terminal)
    if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
  }

  // Block on the wrapper page itself
  document.addEventListener('paste', blockClipboard, true);
  document.addEventListener('copy', blockClipboard, true);
  document.addEventListener('keydown', blockKeys, true);
  document.addEventListener('contextmenu', blockClipboard, true);

  // ── Terminal font (self-hosted, so every student sees the same) ──
  var TERM_FONT = "'JetBrains Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace";
  function applyTermFont(win, doc) {
    var st = doc.createElement('style');
    st.textContent =
      "@font-face{font-family:'JetBrains Mono';src:url('/assets/fonts/JetBrainsMonoNL-Regular.woff2') format('woff2');font-weight:400}" +
      "@font-face{font-family:'JetBrains Mono';src:url('/assets/fonts/JetBrainsMonoNL-Bold.woff2') format('woff2');font-weight:700}";
    (doc.head || doc.documentElement).appendChild(st);
    var tries = 0;
    (function waitTerm() {
      if (!win.term || !win.term.options) { if (tries++ < 50) setTimeout(waitTerm, 200); return; }
      Promise.all([doc.fonts.load("400 14px 'JetBrains Mono'"), doc.fonts.load("700 14px 'JetBrains Mono'")])
        .catch(function() {})
        .then(function() {
          win.term.options.fontFamily = TERM_FONT;
          // ttyd refits rows/cols on resize
          try { win.dispatchEvent(new win.Event('resize')); } catch (e) {}
        });
    })();
  }

  // ── Live countdown (tmux writes "TIME LEFT mm:ss" to the terminal title) ──
  var timerEl = document.getElementById('timer');
  setInterval(function() {
    try {
      var t = (termFrame.contentDocument && termFrame.contentDocument.title) || '';
      var m = t.match(/TIME LEFT ((\d+):)?(\d{1,2}):(\d{2})/);
      if (!m) return;
      var secs = (parseInt(m[2] || '0', 10) * 3600) + parseInt(m[3], 10) * 60 + parseInt(m[4], 10);
      timerEl.textContent = '\u23F1 ' + (m[1] || '') + m[3] + ':' + m[4];
      timerEl.classList.toggle('low', secs <= 300);
      timerEl.hidden = false;
    } catch (e) {}
  }, 1000);

  // ── Same lab open in more than one tab/device ───────────────
  // tmux appends "TABS <n>" (attached clients) to the terminal title.
  var peek = document.getElementById('peek');
  var peekDismissedAt = 0, lastTabs = 1;
  document.getElementById('peekClose').addEventListener('click', function() {
    peekDismissedAt = lastTabs;
    peek.classList.remove('show');
  });
  setInterval(function() {
    try {
      var t = (termFrame.contentDocument && termFrame.contentDocument.title) || '';
      var m = t.match(/TABS (\d+)/);
      if (!m) return;
      var n = parseInt(m[1], 10);
      if (n <= 1) peekDismissedAt = 0;          // back to one tab: re-arm
      if (n > lastTabs && n > peekDismissedAt) peekDismissedAt = 0;  // another tab opened
      lastTabs = n;
      peek.classList.toggle('show', n > 1 && peekDismissedAt === 0);
    } catch (e) {}
  }, 1000);

  // Block inside the terminal iframe (same-origin)
  var termFrame = document.getElementById('term');
  termFrame.addEventListener('load', function() {
    try {
      var iDoc = termFrame.contentDocument || termFrame.contentWindow.document;
      iDoc.addEventListener('paste', blockClipboard, true);
      iDoc.addEventListener('copy', blockClipboard, true);
      iDoc.addEventListener('keydown', blockKeys, true);
      iDoc.addEventListener('contextmenu', blockClipboard, true);

      // Use the bundled JetBrains Mono inside the terminal too
      applyTermFont(termFrame.contentWindow, iDoc);

      // Also block clipboard API
      if (termFrame.contentWindow.navigator && termFrame.contentWindow.navigator.clipboard) {
        Object.defineProperty(termFrame.contentWindow.navigator, 'clipboard', {
          get: function() { return { writeText: function(){return Promise.reject()}, readText: function(){return Promise.reject()}, write: function(){return Promise.reject()}, read: function(){return Promise.reject()} }; }
        });
      }
    } catch(ex) {
      // Cross-origin — iframe sandbox already blocks clipboard
    }
  });
})();
</script>
</body>
</html>
