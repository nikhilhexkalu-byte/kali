<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PentestLab — Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
  }

  .shell {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* ── Sidebar ──────────────────────────────────────── */
  .sidebar {
    width: 48px;
    background: #0d0d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 12px;
    position: relative;
    flex-shrink: 0;
    user-select: none;
    z-index: 2;
  }

  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(0, 255, 65, 0.3) 20%,
      rgba(0, 255, 65, 0.15) 50%,
      rgba(0, 204, 51, 0.08) 80%,
      transparent 100%
    );
  }

  .sb-icon {
    margin-bottom: 16px;
    flex-shrink: 0;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .sidebar:hover .sb-icon { opacity: 1; }

  .sb-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00ff41;
    box-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .sb-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 9px;
    letter-spacing: 5px;
    font-weight: 700;
    color: rgba(0, 255, 65, 0.15);
    text-transform: uppercase;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s;
  }
  .sidebar:hover .sb-label { color: rgba(0, 255, 65, 0.3); }

  .sb-brand {
    font-size: 7px;
    letter-spacing: 3px;
    font-weight: 600;
    color: rgba(0, 255, 65, 0.1);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    flex-shrink: 0;
    transition: color 0.3s;
  }
  .sidebar:hover .sb-brand { color: rgba(0, 255, 65, 0.2); }

  /* ── Terminal frame ───────────────────────────────── */
  .term-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    min-width: 0;
  }

  /* ── Title bar ────────────────────────────────────── */
  .title-bar {
    background: #111128;
    border-bottom: 1px solid rgba(0, 255, 65, 0.12);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }

  .window-controls {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
  }

  .win-btn {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: default;
  }
  .win-btn.close { background: #ff5f57; }
  .win-btn.min   { background: #febc2e; }
  .win-btn.max   { background: #28c840; }

  .title-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .kali-dragon {
    width: 20px; height: 20px;
    flex-shrink: 0;
  }

  .title-text {
    font-size: 12px;
    font-weight: 700;
    color: #c0c8d8;
    letter-spacing: 0.3px;
  }

  .title-spacer { width: 54px; flex-shrink: 0; }

  /* ── Terminal body ────────────────────────────────── */
  .term-body {
    flex: 1;
    position: relative;
    background: #0c0c0c;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
  }

  /* Green glow border on 3 sides (top is title bar) */
  .term-body::before {
    content: '';
    position: absolute;
    left: -1px; right: -1px; bottom: -1px;
    top: -1px;
    border: 1.5px solid #00ff41;
    border-top: none;
    pointer-events: none;
    z-index: 3;
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.03);
    animation: border-glow 4s ease-in-out infinite alternate;
  }

  @keyframes border-glow {
    from { box-shadow: 0 0 15px rgba(0, 255, 65, 0.08), inset 0 0 15px rgba(0, 255, 65, 0.02); }
    to   { box-shadow: 0 0 30px rgba(0, 255, 65, 0.18), inset 0 0 25px rgba(0, 255, 65, 0.04); }
  }

  /* Scanline overlay */
  .term-body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 65, 0.012) 2px,
      rgba(0, 255, 65, 0.012) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .term-body iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    background: #0c0c0c;
    z-index: 1;
  }

  /* ── Top glow on title bar ────────────────────────── */
  .title-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1.5px;
    background: #00ff41;
    box-shadow: 0 0 12px rgba(0, 255, 65, 0.2);
    z-index: 4;
  }

  .term-wrap { position: relative; }

  /* ── Error state ──────────────────────────────────── */
  .term-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: #8a9ab5;
    font-size: 14px;
    text-align: center;
    padding: 24px;
    z-index: 5;
    background: #0c0c0c;
  }
  .term-error.show { display: flex; }
  .term-error .err-icon {
    font-size: 42px;
    opacity: 0.3;
    margin-bottom: 4px;
  }
  .term-error .err-msg {
    color: #ff5f57;
    font-weight: 600;
    font-size: 15px;
  }
  .term-error .err-sub {
    color: #636e7a;
    font-size: 12px;
    max-width: 300px;
    line-height: 1.6;
  }
  .term-error a {
    color: #00ff41;
    text-decoration: none;
    font-size: 13px;
    margin-top: 8px;
    opacity: 0.7;
    transition: opacity 0.2s;
    border: 1px solid rgba(0, 255, 65, 0.2);
    padding: 6px 18px;
    border-radius: 4px;
  }
  .term-error a:hover { opacity: 1; border-color: rgba(0, 255, 65, 0.5); }

  /* ── Mobile ──────────────────────────────────────── */
  @media (max-width: 480px) {
    .sidebar { width: 32px; padding: 10px 0 8px; }
    .sb-label { font-size: 7px; letter-spacing: 3px; }
    .sb-brand { font-size: 5px; }
    .sb-icon { transform: scale(0.75); margin-bottom: 10px; }
    .sb-dot { width: 4px; height: 4px; margin-bottom: 12px; }
    .title-bar { padding: 6px 10px; }
    .title-text { font-size: 11px; }
    .win-btn { width: 10px; height: 10px; }
    .title-spacer { width: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .term-body::before { animation: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <!-- Kali dragon icon -->
    <svg class="sb-icon" width="22" height="26" viewBox="0 0 100 100" fill="none">
      <path d="M50 5 C30 5 15 25 15 45 C15 55 20 65 28 72 L40 60 C35 55 32 48 32 42 C32 30 40 20 50 18 C60 20 68 30 68 42 C68 48 65 55 60 60 L72 72 C80 65 85 55 85 45 C85 25 70 5 50 5Z" fill="#00ff41" opacity="0.8"/>
      <path d="M50 28 C44 28 39 34 39 42 C39 46 41 50 44 53 L50 47 L56 53 C59 50 61 46 61 42 C61 34 56 28 50 28Z" fill="#00cc33"/>
      <path d="M50 75 L42 65 L35 72 L50 90 L65 72 L58 65 Z" fill="#00ff41" opacity="0.7"/>
    </svg>
    <div class="sb-dot"></div>
    <div class="sb-label">PENTESTLAB</div>
    <div class="sb-brand">CYBERHX</div>
  </div>
  <div class="term-wrap">
    <div class="title-bar">
      <div class="window-controls">
        <div class="win-btn close"></div>
        <div class="win-btn min"></div>
        <div class="win-btn max"></div>
      </div>
      <div class="title-center">
        <svg class="kali-dragon" viewBox="0 0 100 100" fill="none">
          <path d="M50 5 C30 5 15 25 15 45 C15 55 20 65 28 72 L40 60 C35 55 32 48 32 42 C32 30 40 20 50 18 C60 20 68 30 68 42 C68 48 65 55 60 60 L72 72 C80 65 85 55 85 45 C85 25 70 5 50 5Z" fill="#00ff41" opacity="0.7"/>
          <path d="M50 28 C44 28 39 34 39 42 C39 46 41 50 44 53 L50 47 L56 53 C59 50 61 46 61 42 C61 34 56 28 50 28Z" fill="#00cc33" opacity="0.8"/>
          <path d="M50 75 L42 65 L35 72 L50 90 L65 72 L58 65 Z" fill="#00ff41" opacity="0.6"/>
        </svg>
        <span class="title-text">Kali Linux – Terminal</span>
      </div>
      <div class="title-spacer"></div>
    </div>
    <div class="term-body">
      <iframe id="term" src="about:blank" allowfullscreen></iframe>
      <div class="term-error" id="termErr">
        <div class="err-icon">⚠</div>
        <div class="err-msg">Lab terminal not available</div>
        <div class="err-sub">This lab slot may have expired or is not assigned to your session.</div>
        <a href="/">← Back to Exam</a>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  var m = window.location.pathname.match(/\/lab\/(\d+)/);
  if (m && parseInt(m[1], 10) >= 1 && parseInt(m[1], 10) <= 10) {
    document.getElementById('term').src = '/term/' + m[1] + '/';
  } else {
    document.getElementById('termErr').classList.add('show');
  }

  // ── Block copy/paste from external environment ──────────────
  function blockClipboard(e) { e.preventDefault(); e.stopPropagation(); }
  function blockKeys(e) {
    if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
  }

  document.addEventListener('paste', blockClipboard, true);
  document.addEventListener('copy', blockClipboard, true);
  document.addEventListener('keydown', blockKeys, true);
  document.addEventListener('contextmenu', blockClipboard, true);

  var termFrame = document.getElementById('term');
  termFrame.addEventListener('load', function() {
    try {
      var iDoc = termFrame.contentDocument || termFrame.contentWindow.document;
      iDoc.addEventListener('paste', blockClipboard, true);
      iDoc.addEventListener('copy', blockClipboard, true);
      iDoc.addEventListener('keydown', blockKeys, true);
      iDoc.addEventListener('contextmenu', blockClipboard, true);

      if (termFrame.contentWindow.navigator && termFrame.contentWindow.navigator.clipboard) {
        Object.defineProperty(termFrame.contentWindow.navigator, 'clipboard', {
          get: function() { return { writeText: function(){return Promise.reject()}, readText: function(){return Promise.reject()}, write: function(){return Promise.reject()}, read: function(){return Promise.reject()} }; }
        });
      }
    } catch(ex) {}
  });
})();
</script>
</body>
</html>
