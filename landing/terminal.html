<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kali Linux — Terminal</title>
<style>
  :root {
    --page: #0a0a1a;
    --chrome-bg: #1a1a2e;
    --chrome-border: #2a2a4a;
    --glow: #00ff41;
    --shell-bg: #0c0c0c;
    --title-text: #e0e0e0;
    --btn-close: #ff5f57;
    --btn-min: #febc2e;
    --btn-max: #28c840;
    color-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--page);
    font-family: 'Hack', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;
  }

  .stage {
    position: fixed;
    inset: 0;
    padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    display: flex;
  }

  /* ── Window ─────────────────────────────────────── */
  .window {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    background: var(--shell-bg);
    box-shadow:
      0 0 0 1.5px var(--glow),
      0 0 30px rgba(0, 255, 65, 0.15),
      0 20px 60px rgba(0, 0, 0, 0.6);
    animation: glow-pulse 4s ease-in-out infinite alternate;
  }
  @keyframes glow-pulse {
    from { box-shadow: 0 0 0 1.5px var(--glow), 0 0 20px rgba(0, 255, 65, 0.1), 0 20px 60px rgba(0, 0, 0, 0.6); }
    to   { box-shadow: 0 0 0 1.5px var(--glow), 0 0 40px rgba(0, 255, 65, 0.2), 0 20px 60px rgba(0, 0, 0, 0.6); }
  }

  /* ── Title bar ──────────────────────────────────── */
  .title-bar {
    flex-shrink: 0;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--chrome-border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
  }
  .window-controls { display: flex; gap: 8px; flex-shrink: 0; }
  .win-btn { width: 13px; height: 13px; border-radius: 50%; }
  .win-btn.close { background: var(--btn-close); }
  .win-btn.minimize { background: var(--btn-min); }
  .win-btn.maximize { background: var(--btn-max); }
  .title-center {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .kali-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .title-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--title-text);
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-spacer { width: 55px; flex-shrink: 0; }

  /* ── Terminal frame ─────────────────────────────── */
  .term-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
    background: var(--shell-bg);
  }
  .term-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--shell-bg);
  }
  /* Faint scanlines — pointer-events off so typing/clicks reach ttyd */
  .term-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.015) 2px, rgba(0, 255, 65, 0.015) 4px);
    pointer-events: none;
  }

  /* ── Error state ────────────────────────────────── */
  .term-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: #c8d6e5;
    font-size: 14px;
    text-align: center;
    padding: 24px;
    z-index: 1;
  }
  .term-error.show { display: flex; }
  .term-error .err-code { font-size: 48px; font-weight: 800; color: rgba(0, 255, 65, 0.2); }
  .term-error a {
    color: var(--glow);
    text-decoration: none;
    font-size: 13px;
    margin-top: 8px;
    padding: 6px 14px;
    border: 1px solid rgba(0, 255, 65, 0.4);
    border-radius: 6px;
  }
  .term-error a:hover { background: rgba(0, 255, 65, 0.08); }

  @media (max-width: 480px) {
    .stage { padding: 6px; }
    .window { border-radius: 10px; }
    .title-bar { padding: 8px 10px; gap: 8px; }
    .win-btn { width: 11px; height: 11px; }
    .title-spacer { width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .window { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="window">
    <div class="title-bar">
      <div class="window-controls" aria-hidden="true">
        <div class="win-btn close"></div>
        <div class="win-btn minimize"></div>
        <div class="win-btn maximize"></div>
      </div>
      <div class="title-center">
        <svg class="kali-icon" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M50 5 C30 5 15 25 15 45 C15 55 20 65 28 72 L40 60 C35 55 32 48 32 42 C32 30 40 20 50 18 C60 20 68 30 68 42 C68 48 65 55 60 60 L72 72 C80 65 85 55 85 45 C85 25 70 5 50 5Z" fill="#00ff41" opacity="0.9"/>
          <path d="M50 28 C44 28 39 34 39 42 C39 46 41 50 44 53 L50 47 L56 53 C59 50 61 46 61 42 C61 34 56 28 50 28Z" fill="#00cc33"/>
          <path d="M50 75 L42 65 L35 72 L50 90 L65 72 L58 65 Z" fill="#00ff41" opacity="0.8"/>
        </svg>
        <span class="title-text">Kali Linux – Terminal</span>
      </div>
      <div class="title-spacer"></div>
    </div>
    <div class="term-wrap">
      <iframe id="term" src="about:blank" allowfullscreen title="Lab terminal"></iframe>
      <div class="term-error" id="termErr">
        <div class="err-code">--</div>
        <div>Lab terminal not available</div>
        <a href="/">Back to exam</a>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  var m = window.location.pathname.match(/\/lab\/(\d+)/);
  if (m && parseInt(m[1], 10) >= 1 && parseInt(m[1], 10) <= 10) {
    document.getElementById('term').src = '/term/' + m[1] + '/';
  } else {
    document.getElementById('termErr').classList.add('show');
  }

  // ── Block copy/paste from external environment ──────────────
  function blockClipboard(e) { e.preventDefault(); e.stopPropagation(); }
  function blockKeys(e) {
    // Block Ctrl+V, Ctrl+Shift+V (paste), Ctrl+Shift+C (copy from terminal)
    if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.key === 'v' || e.key === 'V')) { e.preventDefault(); e.stopPropagation(); }
  }

  // Block on the wrapper page itself
  document.addEventListener('paste', blockClipboard, true);
  document.addEventListener('copy', blockClipboard, true);
  document.addEventListener('keydown', blockKeys, true);
  document.addEventListener('contextmenu', blockClipboard, true);

  // Block inside the terminal iframe (same-origin)
  var termFrame = document.getElementById('term');
  termFrame.addEventListener('load', function() {
    try {
      var iDoc = termFrame.contentDocument || termFrame.contentWindow.document;
      iDoc.addEventListener('paste', blockClipboard, true);
      iDoc.addEventListener('copy', blockClipboard, true);
      iDoc.addEventListener('keydown', blockKeys, true);
      iDoc.addEventListener('contextmenu', blockClipboard, true);

      // Also block clipboard API
      if (termFrame.contentWindow.navigator && termFrame.contentWindow.navigator.clipboard) {
        Object.defineProperty(termFrame.contentWindow.navigator, 'clipboard', {
          get: function() { return { writeText: function(){return Promise.reject()}, readText: function(){return Promise.reject()}, write: function(){return Promise.reject()}, read: function(){return Promise.reject()} }; }
        });
      }
    } catch(ex) {
      // Cross-origin — iframe sandbox already blocks clipboard
    }
  });
})();
</script>
</body>
</html>
