<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberHX Admin</title>
<style>
  :root {
    --bg: #0a0e17;
    --bg-card: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --accent: #06b6d4;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }

  h1 { font-size: 26px; margin-bottom: 6px; color: var(--text); }
  .subtitle { color: var(--text-dim); margin-bottom: 28px; font-size: 14px; }

  .exam-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 28px;
  }
  .exam-panel h2 {
    font-size: 16px;
    margin-bottom: 14px;
    color: var(--accent);
  }
  .exam-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .exam-badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .exam-badge.idle {
    background: rgba(100,116,139,0.1);
    color: var(--text-dim);
    border: 1px solid rgba(100,116,139,0.2);
  }
  .exam-badge.running {
    background: rgba(6,182,212,0.1);
    color: var(--accent);
    border: 1px solid rgba(6,182,212,0.2);
  }
  .exam-badge.completed {
    background: rgba(34,197,94,0.1);
    color: var(--green);
    border: 1px solid rgba(34,197,94,0.2);
  }
  .exam-info { font-size: 14px; color: var(--text-dim); }
  .exam-info strong { color: var(--text); }
  .exam-timer {
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .exam-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    padding: 9px 18px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    background: var(--bg-card);
    color: var(--text);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger {
    border-color: rgba(239,68,68,0.3);
    color: var(--red);
  }
  .btn.danger:hover {
    border-color: var(--red);
    background: rgba(239,68,68,0.08);
  }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: none;
  }

  .section-title {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th {
    text-align: left;
    padding: 12px 14px;
    background: rgba(6,182,212,0.06);
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  td {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  tr:hover td { background: rgba(255,255,255,0.015); }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }

  .pw-cell { display: flex; align-items: center; gap: 8px; }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }

  .bulk-actions { margin-top: 20px; display: flex; gap: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>Admin Panel</h1>
  <p class="subtitle">Exam control and lab credentials</p>

  <div class="exam-panel">
    <h2>Exam Control</h2>
    <div class="exam-row">
      <span>Status:</span>
      <span class="exam-badge idle" id="examBadge">IDLE</span>
      <span class="exam-info" id="examStage"></span>
    </div>
    <div class="exam-row" id="examTimerRow" style="display:none">
      <span>Time Remaining:</span>
      <span class="exam-timer" id="examTimer">--:--</span>
    </div>
    <div class="exam-actions">
      <button class="btn primary" id="btnStart" onclick="adminStartExam()">Start Exam</button>
      <button class="btn danger" id="btnReset" onclick="adminResetExam()">Reset Exam</button>
    </div>
  </div>

  <h2 class="section-title">Lab Credentials</h2>
  <table>
    <thead>
      <tr>
        <th>Lab</th>
        <th>Stage</th>
        <th>Username</th>
        <th>Password</th>
        <th>URL Path</th>
      </tr>
    </thead>
    <tbody id="credTable">
      <tr><td colspan="5" style="text-align:center;color:var(--text-dim)">Loading...</td></tr>
    </tbody>
  </table>

  <div class="bulk-actions">
    <button class="btn" onclick="copyAll()">Copy All Credentials</button>
  </div>
</div>

<script>
  var labData = [];
  var examSyncRemaining = 0;
  var examLastSync = 0;

  var stageMap = {1: [1,2], 2: [3,4], 3: [5,6]};

  function labStage(labId) {
    for (var s in stageMap) {
      if (stageMap[s].indexOf(labId) !== -1) return parseInt(s);
    }
    return 0;
  }

  function fmtTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function getRemaining() {
    if (examSyncRemaining <= 0) return 0;
    var elapsed = (Date.now() / 1000) - examLastSync;
    return Math.max(0, Math.round(examSyncRemaining - elapsed));
  }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(String(s)));
    return d.innerHTML;
  }

  async function loadCreds() {
    try {
      var res = await fetch('/api/admin/labs');
      var data = await res.json();
      labData = data.labs;
      renderTable(data.labs);
    } catch (e) {
      document.getElementById('credTable').innerHTML =
        '<tr><td colspan="5" style="color:var(--red)">Failed to load credentials</td></tr>';
    }
  }

  function renderTable(labs) {
    var tbody = document.getElementById('credTable');
    tbody.innerHTML = labs.map(function(lab) {
      var s = labStage(lab.id);
      return '<tr>' +
        '<td><strong>' + esc(lab.id) + '</strong></td>' +
        '<td>Stage ' + s + '</td>' +
        '<td class="mono">' + esc(lab.user) + '</td>' +
        '<td><div class="pw-cell">' +
          '<span class="mono">' + esc(lab.password) + '</span>' +
          '<button class="copy-btn" onclick="copyPw(this,\'' + esc(lab.password) + '\')">Copy</button>' +
        '</div></td>' +
        '<td class="mono">' + esc(lab.path) + '</td>' +
      '</tr>';
    }).join('');
  }

  async function pollExam() {
    try {
      var res = await fetch('/api/exam/status');
      var data = await res.json();
      examSyncRemaining = data.time_remaining || 0;
      examLastSync = Date.now() / 1000;
      renderExamStatus(data);
    } catch (e) {}
  }

  function renderExamStatus(data) {
    var badge = document.getElementById('examBadge');
    var stage = document.getElementById('examStage');
    var timerRow = document.getElementById('examTimerRow');
    var btnStart = document.getElementById('btnStart');

    badge.className = 'exam-badge ' + data.status;
    badge.textContent = data.status.toUpperCase();

    if (data.status === 'running') {
      stage.innerHTML = '<strong>Stage ' + data.current_stage + '</strong> — ' + esc(data.stage_name || '');
      timerRow.style.display = '';
      btnStart.disabled = true;
    } else if (data.status === 'completed') {
      stage.textContent = 'All stages completed';
      timerRow.style.display = 'none';
      btnStart.disabled = true;
    } else {
      stage.textContent = 'Ready to start';
      timerRow.style.display = 'none';
      btnStart.disabled = false;
    }
  }

  function tickExamTimer() {
    var el = document.getElementById('examTimer');
    el.textContent = fmtTime(getRemaining());
  }

  async function adminStartExam() {
    var btn = document.getElementById('btnStart');
    btn.disabled = true;
    btn.textContent = 'Starting...';
    try {
      var res = await fetch('/api/exam/start', {method: 'POST'});
      var data = await res.json();
      if (data.error) alert(data.error);
      btn.textContent = 'Start Exam';
      pollExam();
    } catch (e) {
      alert('Failed to start exam');
      btn.disabled = false;
      btn.textContent = 'Start Exam';
    }
  }

  async function adminResetExam() {
    if (!confirm('Reset exam? This will kill all active lab sessions.')) return;
    try {
      var res = await fetch('/api/exam/reset', {method: 'POST'});
      var data = await res.json();
      if (data.ok) pollExam();
      else alert('Reset failed');
    } catch (e) {
      alert('Failed to reset exam');
    }
  }

  function copyPw(btn, pw) {
    navigator.clipboard.writeText(pw);
    btn.textContent = 'OK';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1500);
  }

  function copyAll() {
    var host = window.location.origin;
    var text = labData.map(function(l) {
      return 'Lab ' + l.id + ' (Stage ' + labStage(l.id) + '): User=' + l.user +
        '  Password=' + l.password + '  URL=' + host + l.path;
    }).join('\n');
    navigator.clipboard.writeText(text);
  }

  loadCreds();
  pollExam();
  setInterval(pollExam, 3000);
  setInterval(tickExamTimer, 1000);
</script>
</body>
</html>
