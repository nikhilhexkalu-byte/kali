# ── CyberHX Lab — Tinyproxy config ───────────────────────────────
# Whitelist proxy: only allows traffic to *.cyberhx.com

Port 8888
Listen 127.0.0.1
Timeout 30
MaxClients 50

# Logging
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Warning
Syslog Off

# Domain filter — DENY by default, allow only whitelist
Filter "/etc/tinyproxy/filter.txt"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off

# Block CONNECT method to prevent HTTPS tunneling bypass
# CONNECT bypasses URL-based filtering — must be restricted
ConnectPort 443
ConnectPort 563

# Allow local connections only
Allow 127.0.0.1/8

# Pid file
PidFile "/var/run/tinyproxy/tinyproxy.pid"

# Disable upstream features that could be abused
DisableViaHeader Yes

# Required headers
ViaProxyName "cyberhx-sandbox"
